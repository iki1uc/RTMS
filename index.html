<!-- ⭐ RTMS 81(+1) STATEENGINE – REAL VERGLEICH ⭐ -->
<div class="box">
    <h2>RTMS StateEngine – Realvergleich</h2>
    <p>81‑Lauf + Meta‑Maxi + REAL‑Abgleich</p>

    <ul id="rtms-status">
        <li>Wird geladen…</li>
    </ul>
</div>

<script>
// REAL-WERT (dein echter Kernwert)
let REAL_VALUE = 0.874;   // <- dein realer Wert (manuell oder später automatisch)

// 81 Einheiten erzeugen
function create81() {
    let arr = [];
    for (let i = 0; i < 81; i++) {
        arr.push({
            v: Math.random(),
            drift: Math.random() * 0.03,
            stability: Math.random(),
            tolerance: 1
        });
    }
    return arr;
}

// +1 Meta‑Maxi
function metaMaxi(units) {
    const values = units.map(u => u.v).sort();
    const min = values[0];
    const mid = values[40];
    const max = values[80];

    const avgDrift = units.reduce((a,b)=>a+b.drift,0) / 81;

    return {
        optimum: ((min + mid + max) / 3).toFixed(3),
        drift: avgDrift.toFixed(3),
        ncTolerance: (1 - avgDrift).toFixed(3)
    };
}

// REAL‑VERGLEICH
function compareReal(optimum, real) {
    return {
        real: real.toFixed(3),
        diff: (real - optimum).toFixed(3),
        better: real > optimum ? "REAL punktet" : "RTMS punktet"
    };
}

// Haupt‑Engine
function rtms81Engine() {
    const units = create81();
    const meta = metaMaxi(units);
    const cmp = compareReal(parseFloat(meta.optimum), REAL_VALUE);

    document.getElementById("rtms-status").innerHTML = `
        <li>81‑Lauf: Aktiv</li>
        <li>Optimum (RTMS): ${meta.optimum}</li>
        <li>REAL‑Wert: ${cmp.real}</li>
        <li>Abweichung (REAL - Optimum): ${cmp.diff}</li>
        <li><b>Vorteil:</b> ${cmp.better}</li>
        <li>Durchschnitts‑Drift: ${meta.drift}</li>
        <li>NC‑Tolerance: ${meta.ncTolerance}</li>
        <li>Meta‑Maxi: OK</li>
        <li>Modus: 81(+1) REAL</li>
    `;
}

setInterval(rtms81Engine, 2000);
rtms81Engine();
</script>
