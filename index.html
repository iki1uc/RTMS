<!-- ⭐ RTMS 81(+1) STATEENGINE ⭐ -->
<div class="box">
    <h2>RTMS StateEngine</h2>
    <p>81‑Lauf + Meta‑Maxi (NC‑Tolerance Mode)</p>

    <ul id="rtms-status">
        <li>Wird geladen…</li>
    </ul>
</div>

<script>
// 81 Einheiten erzeugen
function create81() {
    let arr = [];
    for (let i = 0; i < 81; i++) {
        arr.push({
            v: Math.random(),
            drift: Math.random() * 0.03,
            stability: Math.random(),
            tolerance: 1
        });
    }
    return arr;
}

// +1 Meta‑Maxi
function metaMaxi(units) {
    const values = units.map(u => u.v).sort();
    const min = values[0];
    const mid = values[40];
    const max = values[80];

    const avgDrift = units.reduce((a,b)=>a+b.drift,0) / 81;

    return {
        optimum: ((min + mid + max) / 3).toFixed(3),
        drift: avgDrift.toFixed(3),
        ncTolerance: (1 - avgDrift).toFixed(3)
    };
}

// Haupt‑Engine
function rtms81Engine() {
    const units = create81();
    const meta = metaMaxi(units);

    document.getElementById("rtms-status").innerHTML = `
        <li>81‑Lauf: Aktiv</li>
        <li>Optimum (Min/Mid/Max): ${meta.optimum}</li>
        <li>Durchschnitts‑Drift: ${meta.drift}</li>
        <li>NC‑Tolerance: ${meta.ncTolerance}</li>
        <li>Meta‑Maxi: OK</li>
        <li>Modus: 81(+1)</li>
    `;
}

setInterval(rtms81Engine, 2000);
rtms81Engine();
</script>
