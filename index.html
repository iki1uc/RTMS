<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>RTMS – Live Systemprofil</title>
    <style>
        body {
            background: #0d0d0d;
            color: #e6e6e6;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .box {
            border: 1px solid #444;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            background: #1a1a1a;
        }
        h2 {
            margin-top: 0;
            color: #4db8ff;
        }
        ul {
            list-style: none;
            padding-left: 0;
        }
        li {
            padding: 4px 0;
        }
    </style>
</head>

<body>

<!-- ⭐ RTMS SYSTEMPROFIL ⭐ -->
<div class="box">
    <h2>RTMS – Systemprofil (Live)</h2>
    <ul>
        <li>System: Z390‑A Pro / i5‑9600K / 32 GB / GTX 1660</li>
        <li>Leitung: 600 Mbit</li>
        <li>RTMS‑Modus: 81(+1) REAL</li>
        <li>EICH: 1.000</li>
        <li>ZEIT: 0.982</li>
        <li>REAL: 0.874</li>
        <li>Stand: 15.06.2026 – xh</li>
    </ul>
</div>

<!-- ⭐ RTMS 81(+1) STATEENGINE ⭐ -->
<div class="box">
    <h2>RTMS StateEngine</h2>
    <p>81‑Lauf + Meta‑Maxi (NC‑Tolerance Mode)</p>

    <ul id="rtms-status">
        <li>Wird geladen…</li>
    </ul>
</div>

<script>
// 81 Einheiten erzeugen
function create81() {
    let arr = [];
    for (let i = 0; i < 81; i++) {
        arr.push({
            v: Math.random(),
            drift: Math.random() * 0.03,
            stability: Math.random(),
            tolerance: 1
        });
    }
    return arr;
}

// +1 Meta‑Maxi
function metaMaxi(units) {
    const values = units.map(u => u.v).sort();
    const min = values[0];
    const mid = values[40];
    const max = values[80];

    const avgDrift = units.reduce((a,b)=>a+b.drift,0) / 81;

    return {
        optimum: ((min + mid + max) / 3).toFixed(3),
        drift: avgDrift.toFixed(3),
        ncTolerance: (1 - avgDrift).toFixed(3)
    };
}

// Haupt‑Engine
function rtms81Engine() {
    const units = create81();
    const meta = metaMaxi(units);

    document.getElementById("rtms-status").innerHTML = `
        <li>81‑Lauf: Aktiv</li>
        <li>Optimum (Min/Mid/Max): ${meta.optimum}</li>
        <li>Durchschnitts‑Drift: ${meta.drift}</li>
        <li>NC‑Tolerance: ${meta.ncTolerance}</li>
        <li>Meta‑Maxi: OK</li>
        <li>Modus: 81(+1)</li>
    `;
}

setInterval(rtms81Engine, 2000);
rtms81Engine();
</script>

</body>
</html>
